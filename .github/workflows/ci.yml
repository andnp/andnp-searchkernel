name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type check
        run: uv run pyrefly check

      - name: Check imports with import-linter
        run: uv run lint-imports

      - name: Run unit tests
        run: uv run pytest tests/unit --strict-markers -m "not slow and not real_embeddings" -v

      - name: Run integration tests
        run: uv run pytest tests/integration --strict-markers -m "not slow and not real_embeddings" -v
