name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check out release branch
        run: git switch -C main

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Check package version consistency
        run: python scripts/check_version.py

      - name: Create semantic release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uvx --from python-semantic-release==10.6.1 semantic-release version --no-changelog

      - name: Check released package version consistency
        run: python scripts/check_version.py

      - name: Dispatch PyPI publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD 'v*' | head -n 1)"
          if [[ -z "$tag" ]]; then
            echo "No release tag created."
            exit 0
          fi
          gh workflow run publish.yml --ref "$tag"
